<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aerial Blackmoon | Academia de danza aérea</title>

<style>

* {
    box-sizing: border-box;
}

body {
    position: relative;
    isolation: isolate;
    min-height: 100vh;
    margin: 0;
    padding: 0 16px;
    overflow-x: hidden;
    background: #0b0c10;
    color: #f5f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    text-align: center;
    line-height: 1.5;
}

body::before {
    position: fixed;
    z-index: -1;
    inset: 0;
    background:
        linear-gradient(rgba(12, 13, 18, 0.72), rgba(12, 13, 18, 0.84)),
        url("aerial black moon.jpg") center / cover no-repeat;
    content: "";
}

.navbar {
    position: fixed;
    z-index: 1000;
    top: 12px;
    left: 50%;
    display: flex;
    justify-content: center;
    gap: 8px;
    width: min(calc(100% - 24px), 680px);
    padding: 8px;
    transform: translateX(-50%);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 999px;
    background: rgba(28, 29, 34, 0.76);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
}

.navbar a {
    padding: 9px 14px;
    border-radius: 999px;
    color: rgba(255, 255, 255, 0.82);
    font-size: 0.9rem;
    font-weight: 500;
    text-decoration: none;
    transition: background 0.2s ease, color 0.2s ease;
}

.navbar a:hover,
.navbar a:focus-visible {
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
}

.glass-box {
    width: min(100%, 760px);
    margin: 24px auto;
    padding: 22px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.055);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.18);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
}

.music-box {
    margin-top: 100px;
    padding: 14px;
}

.page-title {
    width: min(100%, 760px);
    margin: 36px auto 22px;
}

.page-title h1 {
    margin: 0;
    color: #f5f5f7;
    font-size: clamp(1.5rem, 5vw, 2.15rem);
    font-weight: 650;
    letter-spacing: -0.035em;
}

.social-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 0;
    list-style: none;
}

.social-grid li {
    min-width: 0;
    padding: 18px 14px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.045);
    transition: background 0.2s ease, border-color 0.2s ease;
}

.social-grid li:hover {
    border-color: rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.075);
}

.enlace-botón {
    display: block;
    margin-top: 12px;
    padding: 10px 12px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.07);
    color: #fff;
    font-size: 0.9rem;
    font-weight: 600;
    text-decoration: none;
    transition: background 0.2s ease;
}

.enlace-botón:hover,
.enlace-botón:focus-visible {
    background: rgba(255, 255, 255, 0.14);
}

.icono-red {
    width: 76px;
    height: 76px;
    object-fit: contain;
    border-radius: 16px;
}

iframe {
    display: block;
    width: 100%;
    border: 0;
    border-radius: 14px;
}

footer {
    width: min(100%, 760px);
    margin: 24px auto 40px;
    padding: 14px;
    color: rgba(255, 255, 255, 0.55);
    font-size: 0.9rem;
}

footer p {
    margin: 4px 0;
}

.boton-ws {
    position: fixed;
    z-index: 3000;
    right: 18px;
    bottom: 18px;
    display: grid;
    width: 52px;
    height: 52px;
    place-items: center;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 50%;
    background: #25d366;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
}

.boton-ws img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

#bm-intro {
    position: fixed;
    z-index: 99999;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 20px;
    background:
        linear-gradient(rgba(9, 10, 14, 0.72), rgba(9, 10, 14, 0.84)),
        url("aerial black moon.jpg") center / cover no-repeat;
}

#bm-intro.hidden {
    animation: fadeOut 0.6s forwards;
}

.bm-intro-box {
    width: min(100%, 440px);
    padding: 32px 24px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 28px;
    background: rgba(30, 31, 37, 0.62);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
}

.bm-intro-box h1 {
    margin: 0;
    color: #fff;
    font-size: clamp(1.7rem, 7vw, 2.4rem);
    letter-spacing: -0.04em;
}

.bm-intro-box p {
    margin: 12px 0 24px;
    color: rgba(255, 255, 255, 0.68);
    font-size: 1rem;
}

.bm-intro-box button {
    min-width: 140px;
    padding: 12px 24px;
    border: 0;
    border-radius: 999px;
    background: #f5f5f7;
    color: #17181d;
    font: inherit;
    font-weight: 650;
    cursor: pointer;
    transition: opacity 0.2s ease;
}

.bm-intro-box button:hover,
.bm-intro-box button:focus-visible {
    opacity: 0.82;
}

@keyframes fadeOut {
    to {
        opacity: 0;
        visibility: hidden;
    }
}

@media (max-width: 600px) {
    body {
        padding: 0 12px;
    }

    .navbar {
        top: 8px;
        gap: 0;
        padding: 5px;
    }

    .navbar a {
        padding: 9px 10px;
        font-size: 0.78rem;
    }

    .music-box {
        margin-top: 82px;
        padding: 10px;
    }

    .glass-box {
        padding: 16px;
        border-radius: 20px;
    }

    .social-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px;
    }

    .social-grid li {
        padding: 14px 10px;
        border-radius: 16px;
    }

    .icono-red {
        width: 64px;
        height: 64px;
    }

    .enlace-botón {
        padding: 9px 8px;
        font-size: 0.84rem;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
    }
}

</style>
</head>
