<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🛒 PRODUCTOS BLACKMOON 🛒</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
    background: #09090d;
}

body {
    position: relative;
    isolation: isolate;
    min-height: 100vh;
    margin: 0;
    padding: 32px 20px 48px;
    overflow-x: hidden;
    color: #fff;
    background: transparent;
    font-family: 'Montserrat', Arial, sans-serif;
}

body::before {
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
        linear-gradient(rgba(7, 7, 12, 0.76), rgba(7, 7, 12, 0.9)),
        url("FONDO.jpg") center / cover no-repeat;
    content: "";
    transition: opacity 0.3s ease;
}

body.background-hidden::before {
    opacity: 0;
}

.page {
    width: min(100%, 820px);
    margin: 0 auto;
}

.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 28px;
}

.topbar a,
.background-toggle {
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 999px;
    padding: 9px 14px;
    color: #fff;
    background: rgba(12, 12, 18, 0.7);
    font: inherit;
    font-size: 0.82rem;
    text-decoration: none;
}

.background-toggle {
    cursor: pointer;
}

h1 {
    margin: 0 0 8px;
    font-size: clamp(1.7rem, 5vw, 2.5rem);
    letter-spacing: 0.12em;
}

.eyebrow {
    margin: 0 0 10px;
    color: #d3b4eb;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.2em;
}

.subtitle {
    margin: 0 0 24px;
    color: rgba(255, 255, 255, 0.72);
    font-size: 0.92rem;
    line-height: 1.6;
}

.carousel {
    position: relative;
    width: min(100%, 560px);
    margin: 28px auto 16px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 14px;
    background: rgba(12, 12, 18, 0.72);
}

.carousel-item {
    display: none;
    padding: 14px;
}

.carousel-item.active {
    display: block;
}

.carousel-item img {
    display: block;
    width: 100%;
    height: min(58vh, 390px);
    min-height: 220px;
    border-radius: 9px;
    object-fit: contain;
    background: rgba(0, 0, 0, 0.22);
}

.img-name {
    margin-top: 14px;
    font-size: 1rem;
    letter-spacing: 0.04em;
}

.carousel-control {
    position: absolute;
    top: 42%;
    display: grid;
    width: 42px;
    height: 42px;
    place-items: center;
    border: 1px solid rgba(255, 255, 255, 0.24);
    border-radius: 50%;
    color: #fff;
    background: rgba(0, 0, 0, 0.58);
    font-size: 1.3rem;
    cursor: pointer;
}

.carousel-control:hover,
.carousel-control:focus-visible,
.background-toggle:hover,
.background-toggle:focus-visible,
.topbar a:hover {
    background: rgba(255, 255, 255, 0.16);
}

.prev { left: 22px; }
.next { right: 22px; }

.carousel-dots {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    margin: 16px auto 24px;
}

.product-count {
    margin: 0 0 18px;
    color: rgba(255, 255, 255, 0.6);
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    text-align: center;
}

.carousel-dot {
    width: 9px;
    height: 9px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.35);
    cursor: pointer;
}

.carousel-dot[aria-current="true"] {
    background: #fff;
    transform: scale(1.2);
}

.buy-button {
    display: block;
    width: fit-content;
    margin: 0 auto;
    border: 1px solid rgba(37, 211, 102, 0.6);
    border-radius: 9px;
    padding: 13px 24px;
    color: #fff;
    background: #168b48;
    font: inherit;
    font-weight: 600;
    text-decoration: none;
    box-shadow: 0 8px 24px rgba(37, 211, 102, 0.16);
    transition: background 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
}

.buy-button:hover,
.buy-button:focus-visible {
    background: #1aa657;
    box-shadow: 0 10px 28px rgba(37, 211, 102, 0.28);
    transform: translateY(-2px);
}

footer {
    margin-top: 42px;
    color: rgba(255, 255, 255, 0.58);
    font-size: 0.82rem;
}

@media (max-width: 600px) {
    body {
        padding: 22px 16px 36px;
    }

    .carousel-item {
        padding: 9px;
    }

    .carousel-item img {
        height: 48vh;
    }

    .prev { left: 16px; }
    .next { right: 16px; }
}
</style>

</head>

<body>
<main class="page">
    <nav class="topbar" aria-label="Navegación principal">
        <a href="index.html">Inicio</a>
        <button class="background-toggle" id="backgroundToggle" type="button" aria-pressed="true">Ocultar fondo</button>
    </nav>

    <header>
        <p class="eyebrow">CATÁLOGO</p>
        <h1>PRODUCTOS BLACKMOON</h1>
        <p class="subtitle">Explora cada producto y escríbenos para comprar.</p>
    </header>

    <section class="carousel" aria-label="Catálogo de productos">
        <div class="carousel-item active" aria-hidden="false">
            <img src="BREAS.jpg" alt="Paquete de breas">
            <div class="img-name">PAQUETE DE BREAS</div>
        </div>
        <div class="carousel-item" aria-hidden="true">
            <img src="BREAS 2.jpg" alt="Breas 2">
            <div class="img-name">BREAS 2</div>
        </div>
        <div class="carousel-item" aria-hidden="true">
            <img src="BREA SECA.jpg" alt="Brea seca">
            <div class="img-name">BREA SECA</div>
        </div>
        <div class="carousel-item" aria-hidden="true">
            <img src="02 BREAS.jpg" alt="Breas">
            <div class="img-name">BREAS</div>
        </div>
        <div class="carousel-item" aria-hidden="true">
            <img src="03 MAGNESIAS.jpg" alt="Magnesia">
            <div class="img-name">MAGNESIA</div>
        </div>
        <div class="carousel-item" aria-hidden="true">
            <img src="rec.jpg" alt="Reconocimientos">
            <div class="img-name">RECONOCIMIENTOS</div>
        </div>
        <div class="carousel-item" aria-hidden="true">
            <img src="pla.jpg" alt="Playeras">
            <div class="img-name">PLAYERAS</div>
        </div>

        <button class="carousel-control prev" type="button" aria-label="Ver producto anterior" onclick="moveSlide(-1)">&#10094;</button>
        <button class="carousel-control next" type="button" aria-label="Ver producto siguiente" onclick="moveSlide(1)">&#10095;</button>
    </section>

    <p class="product-count" id="productCount" aria-live="polite"></p>
    <nav class="carousel-dots" id="carouselDots" aria-label="Seleccionar producto"></nav>

    <a class="buy-button" id="buyButton" href="https://wa.me/5215560693556?text=Hola%2C%20me%20interesa%20el%20PAQUETE%20DE%20BREAS" target="_blank" rel="noopener noreferrer">
        Comprar por WhatsApp&nbsp; ↗
    </a>

    <footer>&copy; Todos Somos Blackmoon · Y... VOLEMOS ALTO</footer>
</main>

<script>
const products = [...document.querySelectorAll(".carousel-item")];
const dotsContainer = document.getElementById("carouselDots");
const productCount = document.getElementById("productCount");
const buyButton = document.getElementById("buyButton");
const backgroundToggle = document.getElementById("backgroundToggle");
const whatsappNumber = "5215560693556";
let currentIndex = 0;

products.forEach((product, index) => {
    const dot = document.createElement("button");
    dot.className = "carousel-dot";
    dot.type = "button";
    dot.setAttribute("aria-label", `Ver ${product.querySelector(".img-name").textContent}`);
    dot.addEventListener("click", () => moveSlide(index - currentIndex));
    dotsContainer.appendChild(dot);
});

function moveSlide(direction) {
    currentIndex = (currentIndex + direction + products.length) % products.length;

    products.forEach((product, index) => {
        const isCurrent = index === currentIndex;
        product.classList.toggle("active", isCurrent);
        product.setAttribute("aria-hidden", String(!isCurrent));
        dotsContainer.children[index].setAttribute("aria-current", String(isCurrent));
    });

    const productName = products[currentIndex].querySelector(".img-name").textContent.trim();
    productCount.textContent = `${String(currentIndex + 1).padStart(2, "0")} / ${String(products.length).padStart(2, "0")}`;
    buyButton.href = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(`Hola, me interesa el producto ${productName}`)}`;
}

moveSlide(0);

backgroundToggle.addEventListener("click", () => {
    const backgroundVisible = document.body.classList.toggle("background-hidden") === false;
    backgroundToggle.textContent = backgroundVisible ? "Ocultar fondo" : "Mostrar fondo";
    backgroundToggle.setAttribute("aria-pressed", String(backgroundVisible));
});
</script>

</body>
</html>
